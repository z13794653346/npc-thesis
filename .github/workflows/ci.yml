name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npc-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          # 关闭 post-job 的 `uv cache prune`：曾导致随机红灯（卡 5 分钟 exit 2）
          prune-cache: false
      - run: uv sync --group dev --frozen
      - run: uv run pytest -q
      - run: uv run ruff check app tests scripts migrations

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npc-system/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: npc-system/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          prune-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: npc-system/frontend/package-lock.json
      - name: Install backend deps
        working-directory: npc-system
        run: uv sync --group dev --frozen
      - name: Install frontend deps
        working-directory: npc-system/frontend
        run: npm ci
      - name: Build frontend
        working-directory: npc-system/frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: npc-system/frontend
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: npc-system/frontend
        run: npm run test:e2e
